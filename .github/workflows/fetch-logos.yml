name: Fetch provider logos

# Downloads Malaysian bank / provider icons (tools/malaysia.tsv) into assets/logos and commits them back.
on:
  push:
    branches: ['tools/fetch-logos']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow cairosvg
      - run: python3 tools/fetch_logos.py tools/malaysia.tsv assets/logos tools/logo-report.json tools/logo-sheet.png
      - name: Commit logos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/logos tools/logo-report.json tools/logo-sheet.png
          git commit -m "Fetched provider logos" || echo "nothing new"
          git push
